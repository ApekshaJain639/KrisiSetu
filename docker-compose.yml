version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: krisisetu-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://krisisetu_admin:secret_password@db:5432/krisisetu_db
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - DATAGOV_API_KEY=${DATAGOV_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
      - api-storage:/app/storage
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        - NEXT_PUBLIC_SARVAM_API_KEY=${NEXT_PUBLIC_SARVAM_API_KEY:-}
    container_name: krisisetu-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_SARVAM_API_KEY=${NEXT_PUBLIC_SARVAM_API_KEY:-}
    depends_on:
      - api

  db:
    image: postgis/postgis:16-3.4
    container_name: krisisetu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: krisisetu_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: krisisetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: krisisetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
  api-storage:
