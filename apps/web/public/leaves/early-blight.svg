<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281a"/>
      <stop offset="100%" stop-color="#0b170e"/>
    </linearGradient>

    <!-- Tomato/Solanaceous leaf gradient -->
    <linearGradient id="tomatoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Target-board concentric ring lesion (Alternaria solani) -->
    <radialGradient id="targetRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#291507"/>
      <stop offset="25%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#78350f"/>
      <stop offset="65%" stop-color="#451a03"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#eBg)"/>

  <!-- Tomato / Solanaceous Compound Leaflet -->
  <g transform="translate(100, 30)">
    <!-- Stem/Petiole -->
    <path d="M 0,340 Q 120,240 220,160" stroke="#166534" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Terminal Leaflet -->
    <path d="M 220,160 C 160,80 200,20 280,10 C 360,20 400,80 340,160 C 290,190 250,180 220,160 Z" fill="url(#tomatoLeaf)"/>
    <path d="M 240,150 L 280,25" stroke="#86efac" stroke-width="2" opacity="0.6"/>

    <!-- Concentric Target-Board Early Blight Spots -->
    <!-- Spot 1 (Primary target spot with concentric rings) -->
    <circle cx="265" cy="80" r="32" fill="url(#targetRing)"/>
    <circle cx="265" cy="80" r="22" stroke="#1c1917" stroke-width="2.5" fill="none" opacity="0.8"/>
    <circle cx="265" cy="80" r="14" stroke="#451a03" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="265" cy="80" r="6" fill="#18181b"/>

    <!-- Spot 2 -->
    <circle cx="310" cy="115" r="24" fill="url(#targetRing)"/>
    <circle cx="310" cy="115" r="16" stroke="#291507" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="310" cy="115" r="5" fill="#18181b"/>

    <!-- Lateral Leaflet Left -->
    <path d="M 120,240 C 40,200 40,130 90,110 C 150,110 180,180 150,230 Z" fill="url(#tomatoLeaf)"/>
    <circle cx="95" cy="155" r="18" fill="url(#targetRing)"/>

    <!-- Lateral Leaflet Right -->
    <path d="M 160,210 C 240,170 270,220 250,280 C 200,300 170,260 160,210 Z" fill="url(#tomatoLeaf)"/>
    <circle cx="220" cy="245" r="20" fill="url(#targetRing)"/>
  </g>

  <!-- Bounding Box Annotation -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4,3">
    <rect x="310" y="60" width="170" height="150" rx="8"/>
  </g>
  <g stroke="#d97706" stroke-width="3" fill="none">
    <path d="M 310,80 L 310,60 L 330,60"/>
    <path d="M 460,60 L 480,60 L 480,80"/>
    <path d="M 480,190 L 480,210 L 460,210"/>
    <path d="M 330,210 L 310,210 L 310,190"/>
  </g>

  <!-- AI Detection Tag -->
  <g transform="translate(310, 60)">
    <rect x="0" y="-22" width="220" height="22" rx="4" fill="#0f172a" opacity="0.9"/>
    <circle cx="10" cy="-11" r="4" fill="#f59e0b"/>
    <text x="20" y="-6" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Target-Board Rings · 96.5%
    </text>
  </g>

  <text x="20" y="385" fill="#86efac" opacity="0.6" font-family="monospace" font-size="10">
    SAMPLE: SOLANACEAE_EARLY_BLIGHT_ICAR_2026
  </text>
</svg>
