<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111f15"/>
      <stop offset="50%" stop-color="#1e3a29"/>
      <stop offset="100%" stop-color="#0a160d"/>
    </linearGradient>

    <!-- Healthy Nut Gradient -->
    <radialGradient id="nutHealthy" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Infected Koleroga Nut Gradient (Rotting water-soaked) -->
    <radialGradient id="nutInfected" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a3a3a3"/>
      <stop offset="30%" stop-color="#78716c"/>
      <stop offset="65%" stop-color="#44403c"/>
      <stop offset="90%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>

    <!-- Water-soaked lesion patch -->
    <radialGradient id="waterSoaked" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#57534e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#kBg)"/>

  <!-- Field Diagnosis Grid Overlay -->
  <g opacity="0.15" stroke="#22c55e" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
  </g>

  <!-- Palm Spathe & Stalk Structure -->
  <path d="M 300,10 Q 320,120 310,220" stroke="#713f12" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 310,130 Q 230,190 180,240" stroke="#854d0e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 310,150 Q 380,210 440,260" stroke="#854d0e" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Arecanut Fruit Bunch -->
  <!-- Upper row nuts (healthy to early onset) -->
  <g transform="translate(0, 0)">
    <ellipse cx="250" cy="170" rx="32" ry="42" fill="url(#nutHealthy)" transform="rotate(-15, 250, 170)"/>
    <ellipse cx="340" cy="165" rx="34" ry="44" fill="url(#nutHealthy)" transform="rotate(10, 340, 165)"/>
  </g>

  <!-- Middle cluster: Severe Koleroga infected nuts (dark rotting, fruit rot) -->
  <g>
    <!-- Nut 1 - heavy rot -->
    <ellipse cx="210" cy="235" rx="38" ry="48" fill="url(#nutInfected)" transform="rotate(-25, 210, 235)"/>
    <!-- Water soaked white fungal mycelium patch -->
    <path d="M 195,215 Q 215,200 230,225 Q 240,250 215,260 Q 190,250 195,215 Z" fill="#e2e8f0" opacity="0.75"/>
    <circle cx="210" cy="245" r="16" fill="url(#waterSoaked)"/>

    <!-- Nut 2 - center infected -->
    <ellipse cx="295" cy="240" rx="42" ry="54" fill="url(#nutInfected)" transform="rotate(-5, 295, 240)"/>
    <!-- Severe fruit drop rot -->
    <path d="M 275,215 Q 310,205 325,235 Q 315,275 285,270 Q 265,245 275,215 Z" fill="#cbd5e1" opacity="0.8"/>
    <circle cx="298" cy="248" r="22" fill="url(#waterSoaked)"/>

    <!-- Nut 3 - heavy rotting -->
    <ellipse cx="380" cy="230" rx="38" ry="48" fill="url(#nutInfected)" transform="rotate(20, 380, 230)"/>
    <path d="M 365,210 Q 395,205 405,235 Q 390,265 370,255 Z" fill="#e2e8f0" opacity="0.7"/>

    <!-- Fallen shedding nut bottom left -->
    <ellipse cx="140" cy="320" rx="32" ry="40" fill="url(#nutInfected)" transform="rotate(-40, 140, 320)"/>
    <!-- Soft rot nut bottom right -->
    <ellipse cx="460" cy="310" rx="35" ry="44" fill="url(#nutInfected)" transform="rotate(35, 460, 310)"/>
  </g>

  <!-- Bounding Box Annotation -->
  <g stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,3">
    <rect x="150" y="160" width="310" height="150" rx="8"/>
  </g>
  <g stroke="#dc2626" stroke-width="3" fill="none">
    <path d="M 150,180 L 150,160 L 170,160"/>
    <path d="M 440,160 L 460,160 L 460,180"/>
    <path d="M 460,290 L 460,310 L 440,310"/>
    <path d="M 170,310 L 150,310 L 150,290"/>
  </g>

  <!-- AI Detection Tag -->
  <g transform="translate(150, 160)">
    <rect x="0" y="-22" width="260" height="22" rx="4" fill="#0f172a" opacity="0.9"/>
    <circle cx="10" cy="-11" r="4" fill="#ef4444"/>
    <text x="20" y="-6" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Phytophthora meadii (Fruit Rot) · 97.4%
    </text>
  </g>

  <text x="20" y="385" fill="#86efac" opacity="0.6" font-family="monospace" font-size="10">
    SAMPLE: ARECANUT_KOLEROGA_PUTTUR_APMC_2026
  </text>
</svg>
