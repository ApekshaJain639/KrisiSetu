services:
  # ---------------------------------------------------------------------------
  # KRISISETU Backend Web Service (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: krisisetu-api
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt && python seed_db.py && python seed_admin.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: DATAGOV_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # KRISISETU Frontend Web Portal (Next.js 14)
  # ---------------------------------------------------------------------------
  - type: web
    name: krisisetu-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: krisisetu-api
          property: host
        transformation: "https://$HOST/api/v1"
      - key: NEXT_PUBLIC_SARVAM_API_KEY
        sync: false
